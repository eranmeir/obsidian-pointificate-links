name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Extract release notes from CHANGELOG.md
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # Print the body of the "## [<tag>]" section, up to the next "## [" heading,
                  # leaving out the link reference definitions at the bottom of the file.
                  awk -v v="$tag" '
                      /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
                      found && /^\[.*\]: / { next }
                      found { print }
                  ' CHANGELOG.md > release-notes.md

                  if ! grep -q '[^[:space:]]' release-notes.md; then
                      echo "::error::CHANGELOG.md has no entry for $tag"
                      exit 1
                  fi

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    --notes-file release-notes.md \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
